name: Sing-Box Rule-Set Database

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Sing-Box
        run: |
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep "browser_download_url.*linux-amd64.tar.gz" \
            | grep -v "sha256" \
            | head -n1 \
            | cut -d '"' -f 4)

          echo "Downloading: $DOWNLOAD_URL"
          wget -q "$DOWNLOAD_URL" -O sing-box.tar.gz

          tar -xf sing-box.tar.gz
          sudo mv sing-box-*-linux-amd64/sing-box /usr/local/bin/
          sing-box version

      - name: Process Rules
        run: |
          mkdir -p output

          declare -A list=(
            ["multi-light"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi.light.txt"
            ["multi-pro-mini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi.pro.mini.txt"
            ["multi-pro-full"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi.pro.txt"
            ["tif-mini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini.txt"
            ["gambling-mini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling.mini.txt"
            ["gambling-medium"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling.medium.txt"
            ["nsfw"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw.txt"
            ["native-tracker"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.trackers.txt"
            ["popupads"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/popupads.txt"
            ["fake"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/fake.txt"
          )

          for tag in "${!list[@]}"; do
            echo "Processing: $tag"
            curl -sL "${list[$tag]}" -o raw.txt

            python3 - <<'EOF'
          import json, sys

          with open('raw.txt', 'r') as f:
              raw_lines = f.readlines()

          domains = []
          for line in raw_lines:
              line = line.strip()
              # Skip komentar dan baris kosong
              if not line or line.startswith('#') or line.startswith('!'):
                  continue
              # Strip prefix wildcard: "*.domain.com" -> "domain.com"
              if line.startswith('*.'):
                  line = line[2:]
              # Validasi minimal ada titik (bukan TLD doang)
              if '.' in line:
                  domains.append(line)

          domains = sorted(set(domains))
          print(f"  Total domains: {len(domains)}")

          rule = {
              "version": 1,
              "rules": [{"domain_suffix": domains}]
          }

          with open('rule.json', 'w') as f:
              json.dump(rule, f)
          EOF

            sing-box rule-set compile rule.json -o "output/$tag.srs"
            echo "  Compiled: output/$tag.srs"
            rm -f raw.txt rule.json
          done

      - name: Deploy to Release Branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Fetch dan setup branch release
          git fetch origin

          if git ls-remote --exit-code --heads origin release; then
            git checkout release
          else
            git checkout --orphan release
            git rm -rf . --quiet || true
          fi

          # Pindahkan hasil compile
          mv output/*.srs .

          git add *.srs
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Update DB Rules: $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin release --force
